<body data-page="play">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap">
    <div class="crumb"><a href="../index.html">홈</a><span>/</span><a href="../play.html">놀이터</a><span>/</span><span>체리 계단</span></div>
    <h1>체리 계단</h1>
    <p>방향을 맞춰 계단을 끝까지 올라요.</p>
  </div></div>

  <section class="band"><div class="wrap bare"><div class="game-shell">
    <div class="game-card g-stairs">
      <div class="g-top">
        <div class="g-title"><img class="pc" src="../assets/p07.png" alt=""><div><h2>체리 계단</h2><small>내 최고 <b class="num" id="best">-</b></small></div></div>
        <div class="g-hud"><div class="stat"><small>오른 칸</small><b class="num" id="score">0</b></div></div>
      </div>
      <div class="g-timer"><i id="timebar"></i></div>
      <div class="g-stage" id="stage">
        <canvas class="stairs-canvas" id="cv" width="480" height="600" aria-label="계단 게임 화면"></canvas>
          <div class="overlay" id="overlay">
            <div class="ov-card">
              <span class="best-badge" id="bestBadge" hidden>최고 기록!</span>
              <img class="pc" id="ovIcon" src="../assets/p07.png" alt="">
              <h4 id="ovTitle">체리 계단</h4>
              <div class="stars" id="stars" hidden></div>
              <p id="ovText">방향을 맞춰 계단을 끝까지 올라요.</p>
              <div class="ov-btns"><button type="button" class="btn cherry" id="startBtn">시작하기</button><a class="btn light" id="otherBtn" href="../play.html" hidden>다른 게임</a></div>
            </div>
          </div>
      </div>
      <div class="pad-row"><button type="button" class="pad-btn" id="turnBtn"><svg class="ico"><use href="#i-turn"/></svg>방향 바꾸기</button><button type="button" class="pad-btn main" id="goBtn"><svg class="ico"><use href="#i-up"/></svg>오르기</button></div>
    </div>
    <p class="how"><b>하는 법</b> · 다음 계단이 지금 방향이면 오르기, 반대쪽이면 방향 바꾸기를 눌러요. 시간이 다 떨어지거나 계단이 없는 쪽으로 가면 끝나요. 키보드는 ← 방향 바꾸기, → 오르기.</p>
    <p class="how"><a class="text-btn" href="../play.html">다른 게임 보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
  </div></div></section>
