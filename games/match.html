<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body data-page="play">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap">
    <div class="crumb"><a href="../index.html">홈</a><span>/</span><a href="../play.html">놀이터</a><span>/</span><span>짝 맞추기</span></div>
    <h1>짝 맞추기</h1>
    <p>같은 퍼스나콘 두 장을 찾아요.</p>
  </div></div>

  <section class="band"><div class="wrap bare"><div class="game-shell">
    <div class="game-card g-match">
      <div class="g-top">
        <div class="g-title"><img class="pc" src="../assets/p03.png" alt=""><div><h2>짝 맞추기</h2><small>내 최고 <b class="num" id="best">-</b></small></div></div>
        <div class="g-hud"><div class="stat"><small>뒤집은 횟수</small><b class="num" id="moves">0</b></div><div class="stat"><small>찾은 짝</small><b class="num" id="found">0/8</b></div><button type="button" class="icon-btn" id="resetBtn" aria-label="새 게임" title="새 게임"><svg class="ico"><use href="#i-reset"/></svg></button></div>
      </div>
      
      <div class="g-stage" id="stage">
        <div class="memo" id="memo"></div>
          <div class="overlay" id="overlay">
            <div class="ov-card">
              <span class="best-badge" id="bestBadge" hidden>최고 기록!</span>
              <img class="pc" id="ovIcon" src="../assets/p03.png" alt="">
              <h4 id="ovTitle">짝 맞추기</h4>
              <div class="stars" id="stars" hidden></div>
              <p id="ovText">같은 퍼스나콘 두 장을 찾아요.</p>
              <div class="ov-btns"><button type="button" class="btn cherry" id="startBtn">시작하기</button><a class="btn light" id="otherBtn" href="../play.html" hidden>다른 게임</a></div>
            </div>
          </div>
      </div>

    </div>
    <p class="how"><b>하는 법</b> · 카드 두 장을 뒤집어 같은 그림이면 짝을 찾은 거예요. 적게 뒤집을수록 좋은 기록이에요.</p>
    <p class="how"><a class="text-btn" href="../play.html">다른 게임 보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></p>
  </div></div></section>
</main>
