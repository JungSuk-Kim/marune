<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방송 도구 | 마루네</title>
<meta name="description" content="방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위예요. 적어 둔 내용은 이 기기에 저장돼요.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/gaegu/700.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="tools">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap">
    <div class="crumb"><a href="index.html">홈</a><span>/</span><span>방송 도구</span></div>
    <h1>방송 도구</h1>
    <p>방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위예요. 적어 둔 내용은 이 기기에 저장돼요.</p>
  </div></div>

  <section class="band"><div class="wrap bare tool-grid">
    <div class="tool-card t-wheel">
      <div class="t-head"><h2>룰렛</h2><span class="sec-sub" id="wheelCount"></span></div>
      <div class="wheel-stage" id="wheelStage">
        <div class="wheel-wrap">
          <svg class="wheel-pin" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50C20 50 4 30 4 18a16 16 0 0 1 32 0c0 12-16 32-16 32z" fill="#e4487e" stroke="#fff" stroke-width="3"/><circle cx="20" cy="18" r="6" fill="#fff"/></svg>
          <canvas id="wheel" width="720" height="720" aria-label="룰렛"></canvas>
          <button type="button" class="wheel-hub" id="spinBtn" aria-label="룰렛 돌리기">돌려!</button>
        </div>
        <div class="tool-result" id="wheelResult" hidden><small>당첨</small><b id="wheelResultText"></b><button type="button" class="btn light" id="wheelAgain">다시 돌리기</button></div>
      </div>
      <form class="chip-editor" id="wheelForm">
        <div class="chips" id="wheelChips"></div>
        <div class="chip-add"><input class="field" id="wheelInput" maxlength="20" placeholder="항목 추가 (예: 노래 한 곡)" aria-label="룰렛 항목 추가"><button type="submit" class="btn">추가</button></div>
      </form>
    </div>
    <div class="tool-col">
      <div class="tool-card t-draw">
        <div class="t-head"><h2>추첨</h2>
          <div class="seg" id="drawSeg" role="group" aria-label="뽑을 사람 수"><button type="button" data-n="1" aria-pressed="true">1명</button><button type="button" data-n="2">2명</button><button type="button" data-n="3">3명</button><button type="button" data-n="5">5명</button></div></div>
        <div class="slot" id="drawSlot"><span id="drawSlotText">누가 뽑힐까요?</span></div>
        <div class="picked" id="drawResult" aria-live="polite"></div>
        <label class="mini-label" for="drawNames">참여자 <span id="drawInfo" class="sec-sub"></span></label>
        <textarea class="field" id="drawNames" placeholder="닉네임을 한 줄에 하나씩 붙여 넣으세요. 같은 이름은 한 번만 계산해요."></textarea>
        <button type="button" class="btn cherry big" id="drawBtn">뽑기</button>
      </div>
      <div class="tool-card t-dice">
        <div class="t-head"><h2>주사위</h2>
          <div class="seg" id="diceSeg" role="group" aria-label="주사위 개수"><button type="button" data-n="1" aria-pressed="true">1개</button><button type="button" data-n="2">2개</button><button type="button" data-n="3">3개</button></div></div>
        <div class="dice-stage"><div class="dice" id="dice"></div><p class="dice-total"><b class="num" id="diceTotal"></b><small id="diceSum"></small></p></div>
        <button type="button" class="btn cherry big" id="rollBtn">굴리기</button>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="data/site.js"></script>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
<script src="js/games.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
