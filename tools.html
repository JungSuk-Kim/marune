<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방송 도구 | 마루네</title>
<meta name="description" content="방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위예요. 적어 둔 내용은 이 기기에 저장돼요.">
<link rel="icon" href="assets/p06.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="tools">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap">
    <div class="crumb"><a href="index.html">홈</a><span>/</span><span>방송 도구</span></div>
    <h1>방송 도구</h1>
    <p>방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위예요. 적어 둔 내용은 이 기기에 저장돼요.</p>
  </div></div>

  <section class="band"><div class="wrap two tool-grid">
    <div class="panel">
      <div class="panel-head"><h2 class="sec-title">룰렛</h2><button type="button" class="btn cherry" id="spinBtn">돌리기</button></div>
      <div class="panel-body" style="padding-top:20px">
        <div class="wheel-wrap"><span class="wheel-pin"></span><canvas id="wheel" width="640" height="640" aria-label="룰렛"></canvas></div>
        <p class="result" id="wheelResult" aria-live="polite"></p>
        <div class="form-row"><label for="wheelItems">항목 (한 줄에 하나)</label><textarea class="field" id="wheelItems" style="min-height:130px"></textarea></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title">추첨</h2><span class="board-tools"><input class="field num" id="drawCount" type="number" min="1" max="20" value="1" style="width:64px" aria-label="뽑을 사람 수"><span class="sec-sub">명</span><button type="button" class="btn cherry" id="drawBtn">뽑기</button></span></div>
        <div class="panel-body" style="padding-top:16px">
          <div class="form-row"><label for="drawNames">참여자 (한 줄에 한 명, 같은 이름은 한 번만 계산)</label><textarea class="field" id="drawNames" style="min-height:130px" placeholder="닉네임을 붙여 넣으세요"></textarea></div>
          <p class="sec-sub" id="drawInfo" style="text-align:center"></p>
          <div class="picked" id="drawResult" aria-live="polite"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title">주사위</h2><span class="board-tools"><select class="field" id="diceCount" aria-label="주사위 개수"><option value="1">1개</option><option value="2">2개</option><option value="3">3개</option></select><button type="button" class="btn cherry" id="rollBtn">굴리기</button></span></div>
        <div class="panel-body" style="padding-top:20px"><div class="dice" id="dice"></div><p class="result num" id="diceResult" aria-live="polite"></p></div>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="data/site.js"></script>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
