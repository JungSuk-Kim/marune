<meta property="og:site_name" content="마루네">

<meta property="og:title" content="방송 도구 | 마루네">
<meta property="og:description" content="방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위, 사다리타기, 추억의 뽑기예요. 적어 둔 내용은 이 기기에 저장돼요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/gaegu/700.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="tools">
<div id="site-header"></div>
<main>
<div class="page-head"><div class="wrap">
    <div class="crumb"><a href="index.html">홈</a><span>/</span><span>방송 도구</span></div>
    <h1>방송 도구</h1>
    <p>방송 중에 화면에 띄워 놓고 쓰는 룰렛, 추첨, 주사위, 사다리타기, 추억의 뽑기예요. 적어 둔 내용은 이 기기에 저장돼요.</p>
  </div></div>

  <section class="band"><div class="wrap bare">
    <div class="tool-tabs" id="toolTabs" role="tablist" aria-label="방송 도구">
      <button type="button" role="tab" data-tool="wheel" aria-selected="true"><span class="tt-ico">🎡</span>룰렛</button>
      <button type="button" role="tab" data-tool="draw" aria-selected="false"><span class="tt-ico">🎱</span>추첨</button>
      <button type="button" role="tab" data-tool="dice" aria-selected="false"><span class="tt-ico">🎲</span>주사위</button>
      <button type="button" role="tab" data-tool="ladder" aria-selected="false"><span class="tt-ico">🪜</span>사다리타기</button>
      <button type="button" role="tab" data-tool="ppopgi" aria-selected="false"><span class="tt-ico">🎁</span>추억의 뽑기</button>
    </div>
    <div class="tool-panel" data-panel="wheel" role="tabpanel">
    <div class="tool-card t-wheel">
      <div class="t-head"><h2>룰렛</h2><span class="sec-sub" id="wheelCount"></span></div>
      <div class="wheel-stage" id="wheelStage">
        <div class="wheel-wrap">
          <svg class="wheel-pin" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50C20 50 4 30 4 18a16 16 0 0 1 32 0c0 12-16 32-16 32z" fill="#e4487e" stroke="#fff" stroke-width="3"/><circle cx="20" cy="18" r="6" fill="#fff"/></svg>
          <canvas id="wheel" width="720" height="720" aria-label="룰렛"></canvas>
          <button type="button" class="wheel-hub" id="spinBtn" aria-label="룰렛 돌리기">돌려!</button>
        </div>
        <div class="tool-result" id="wheelResult" hidden><small>당첨</small><b id="wheelResultText"></b><button type="button" class="btn light" id="wheelAgain">다시 돌리기</button></div>
      </div>
      <form class="chip-editor" id="wheelForm">
        <div class="chips" id="wheelChips"></div>
        <div class="chip-add"><input class="field" id="wheelInput" maxlength="20" placeholder="항목 추가 (예: 노래 한 곡)" aria-label="룰렛 항목 추가"><button type="submit" class="btn">추가</button></div>
      </form>
    </div>
    </div>
    <div class="tool-panel" data-panel="draw" role="tabpanel" hidden>
      <div class="tool-card t-draw">
        <div class="t-head"><h2>추첨</h2>
          <div class="seg" id="drawSeg" role="group" aria-label="뽑을 사람 수"><button type="button" data-n="1" aria-pressed="true">1명</button><button type="button" data-n="2">2명</button><button type="button" data-n="3">3명</button><button type="button" data-n="5">5명</button></div></div>
        <div class="lotto" id="lottoStage"><canvas id="lotto" width="720" height="620" aria-label="추첨기"></canvas><div class="lotto-reveal" id="lottoReveal"></div></div>
        <div class="picked" id="drawResult" aria-live="polite"></div>
        <div class="draw-mode"><div class="seg" id="drawMode" role="group" aria-label="추첨 방식"><button type="button" data-m="num" aria-pressed="true">번호로 뽑기</button><button type="button" data-m="name">닉네임으로 뽑기</button></div><span id="drawInfo" class="sec-sub"></span></div>
        <div class="num-range" id="drawNumBox">
          <label for="drawMax">1번부터</label><input class="field" type="number" id="drawMax" min="2" max="100" value="45" inputmode="numeric"><span>번까지</span>
          <div class="num-quick" id="drawQuick"><button type="button" data-v="10">10</button><button type="button" data-v="30">30</button><button type="button" data-v="45">45</button><button type="button" data-v="100">100</button></div>
        </div>
        <textarea class="field" id="drawNames" hidden aria-label="참여자 닉네임" placeholder="닉네임을 한 줄에 하나씩 붙여 넣으세요. 적은 순서대로 1번, 2번… 공 번호가 붙어요."></textarea>
        <button type="button" class="btn cherry big" id="drawBtn">추첨 시작</button>
      </div>
    </div>
    <div class="tool-panel" data-panel="dice" role="tabpanel" hidden>
      <div class="tool-card t-dice">
        <div class="t-head"><h2>주사위</h2>
          <div class="seg" id="diceSeg" role="group" aria-label="주사위 개수"><button type="button" data-n="1" aria-pressed="true">1개</button><button type="button" data-n="2">2개</button><button type="button" data-n="3">3개</button></div></div>
        <div class="dice-stage"><div class="dice" id="dice"></div><p class="dice-total"><b class="num" id="diceTotal"></b><small id="diceSum"></small></p></div>
        <button type="button" class="btn cherry big" id="rollBtn">굴리기</button>
      </div>
    </div>
    <div class="tool-panel wide" data-panel="ladder" role="tabpanel" hidden>
    <div class="tool-card t-ladder" id="ladderCard">
      <div class="t-head"><h2>사다리타기</h2>
        <div class="ladder-actions"><button type="button" class="btn light" id="ladderNew">사다리 새로 만들기</button><button type="button" class="btn cherry" id="ladderAll">전체 결과 보기</button></div></div>
      <p class="sec-sub">위쪽 이름을 누르면 그 사람의 길을 따라 내려가요. 결과는 도착할 때까지 가려져 있어요.</p>
      <div class="ladder-stage" id="ladderStage">
        <div class="ladder-row top" id="ladderTop"></div>
        <canvas id="ladder" width="960" height="420" aria-label="사다리"></canvas>
        <div class="ladder-row bottom" id="ladderBottom"></div>
      </div>
      <div class="ladder-summary" id="ladderSummary" aria-live="polite"></div>
      <details class="ladder-edit">
        <summary>참가자와 결과 고치기</summary>
        <div class="ladder-edit-grid">
          <div class="form-row"><label for="ladderNames">참가자 (한 줄에 한 명, 2~8명)</label><textarea class="field" id="ladderNames"></textarea></div>
          <div class="form-row"><label for="ladderResults">결과 (참가자 수만큼, 모자라면 '꽝')</label><textarea class="field" id="ladderResults"></textarea></div>
        </div>
        <button type="button" class="btn" id="ladderApply">적용하고 새로 만들기</button>
      </details>
    </div>
    </div>
    <div class="tool-panel" data-panel="ppopgi" role="tabpanel" hidden>
      <div class="tool-card t-pp" id="ppCard">
        <div class="t-head"><h2>추억의 뽑기</h2><button type="button" class="btn light" id="ppNew">새 판 깔기</button></div>
        <div class="pp-board" id="ppBoard">
          <div class="pp-poster">
            <div class="pp-title"><span>★</span>추억의 뽑기<span>★</span></div>
            <ul class="pp-prizes" id="ppPrizes"></ul>
            <p class="pp-left" id="ppLeft"></p>
          </div>
          <div class="pp-grid" id="ppGrid"></div>
          <div class="pp-open" id="ppOpen" aria-live="polite"></div>
        </div>
        <details class="ladder-edit">
          <summary>상품과 장수 고치기</summary>
          <div class="form-row"><label for="ppItems">상품 (한 줄에 하나씩 "상품 x 개수", 위에서부터 1등·2등…)</label><textarea class="field" id="ppItems"></textarea></div>
          <div class="pp-size-row"><span class="mini-label">뽑기 장수</span><div class="seg" id="ppSize" role="group" aria-label="뽑기 장수"><button type="button" data-n="30">30장</button><button type="button" data-n="50">50장</button><button type="button" data-n="100">100장</button></div></div>
          <button type="button" class="btn" id="ppApply">적용하고 새 판 깔기</button>
        </details>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="data/site.js"></script>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
<script src="js/games.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
