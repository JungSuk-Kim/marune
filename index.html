<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마루네 | 마루º 팬 커뮤니티</title>
<meta name="description" content="마루º 팬 커뮤니티 마루네. 방송 일정, 공약, 시그, 게시판, 미니게임을 한곳에서.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/gaegu/700.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
<div class="hero" id="hero">
    <div class="hero-art" id="heroArt" role="img" aria-label="대표 사진"></div>
    <div class="wrap">
      <span class="live-pill" id="livePill"><span class="dot idle" id="liveDot"></span><span id="liveTitle"></span><span class="num" id="viewers" hidden></span></span>
      <span id="liveSub" hidden></span>
      <h1 data-cfg="wordmark"></h1>
      <p data-cfg="tagline"></p>
      <div class="hero-actions">
        <a class="btn cherry" id="watchBtn" href="#" target="_blank" rel="noopener">방송국 가기<svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a>
        <a class="btn light" href="board.html">게시판</a>
        <a class="btn light" id="songBtn" href="#" target="_blank" rel="noopener" hidden>노래책</a>
        <a class="btn light" href="promise.html">공약현황</a>
        <button type="button" class="btn light" id="giftBtn" hidden><svg class="ico" aria-hidden="true"><use href="#i-gift"/></svg>선물 주소</button>
      </div>
    </div>
  </div>

  <div class="wrap home-grid">
    <section class="tile" aria-labelledby="h-board">
      <div class="tile-head"><h2 id="h-board"><span class="ic pink"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg></span>게시판 최근 글</h2><a class="text-btn" href="board.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
      <div class="mini-list" id="boardList"></div>
    </section>

    <section class="tile" id="schedule" aria-labelledby="h-sched">
      <div class="tile-head"><h2 id="h-sched"><span class="ic lilac"><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg></span>이번 주 일정</h2><span id="schedChip"></span></div>
      <div class="sched" id="sched"></div>
    </section>

    <section class="tile" aria-labelledby="h-promise">
      <div class="tile-head"><h2 id="h-promise"><span class="ic peach"><svg class="ico" aria-hidden="true"><use href="#i-flag"/></svg></span>공약현황</h2><span style="display:flex;gap:8px;align-items:center"><span id="promiseChip"></span><a class="text-btn" href="promise.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></span></div>
      <div class="promise" id="promiseList"></div>
    </section>

    <section class="tile" aria-labelledby="h-play">
      <div class="tile-head"><h2 id="h-play"><span class="ic sky"><svg class="ico" aria-hidden="true"><use href="#i-game"/></svg></span>놀이터</h2><a class="text-btn" href="play.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
      <div class="game-tiles" id="gameList"></div>
    </section>

    <section class="tile wide" id="soopPanel" hidden aria-labelledby="h-soop">
      <div class="tile-head"><h2 id="h-soop"><span class="ic mint"><svg class="ico" aria-hidden="true"><use href="#i-mega"/></svg></span>방송국 최신 글</h2><a class="text-btn" href="board.html?cat=soop">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
      <div class="mini-list" id="soopList"></div>
    </section>

    <section class="tile wide" id="videoBand" aria-labelledby="h-video">
      <div class="tile-head"><h2 id="h-video"><span class="ic pink"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg></span>영상 모아보기</h2>
        <div class="seg" id="videoTabs" role="group" aria-label="영상 종류"><button type="button" data-v="yt" aria-pressed="true">유튜브</button><button type="button" data-v="catch">캐치</button><button type="button" data-v="clip">클립</button></div></div>
      <div class="cards" id="videos"></div>
    </section>

    <section class="tile wide persona-tile" aria-labelledby="h-persona">
      <div class="tile-head"><h2 id="h-persona"><span class="ic lilac"><svg class="ico" aria-hidden="true"><use href="#i-star"/></svg></span>구독 퍼스나콘</h2><span class="sec-sub">씨앗부터 체리 선데까지</span></div>
      <div class="persona" id="persona"></div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<script src="data/site.js"></script>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
<script src="js/games.js"></script>
<script src="js/board-store.js"></script>
<script src="js/home.js"></script>
</body>
</html>
