<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마루네 | 마루º 팬 커뮤니티</title>
<meta name="description" content="마루º 팬 커뮤니티 마루네. 방송 일정, 공약, 시그, 자료실, 미니게임을 한곳에서.">
<link rel="icon" href="assets/p06.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main>
<div class="hero" id="hero">
    <div class="hero-art" id="heroArt" role="img" aria-label="대표 사진"></div>
    <div class="wrap">
      <span class="eyebrow"><span data-cfg="streamer"></span> 팬 커뮤니티</span>
      <h1 data-cfg="wordmark"></h1>
      <p data-cfg="tagline"></p>
      <div class="hero-actions">
        <a class="btn light sq" href="board.html"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg>게시판</a>
        <a class="btn light sq" href="promise.html"><svg class="ico" aria-hidden="true"><use href="#i-flag"/></svg>공약현황</a>
        <a class="btn light sq" href="play.html"><svg class="ico" aria-hidden="true"><use href="#i-game"/></svg>놀이터</a>
        <button type="button" class="btn light sq" id="giftBtn" hidden><svg class="ico" aria-hidden="true"><use href="#i-gift"/></svg>선물 주소</button>
      </div>
    </div>
  </div>

  <section class="band">
    <div class="wrap">
      <div class="sec-head"><h2 class="sec-title">LIVE</h2></div>
      <div class="live-row">
        <span class="dot idle" id="liveDot"></span>
        <div class="live-text"><b id="liveTitle"></b><span id="liveSub"></span></div>
        <span class="live-meta num" id="viewers" hidden></span>
        <a class="btn light" id="watchBtn" href="#" target="_blank" rel="noopener">채널 바로가기<svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap two" id="newsGrid">
      <div class="panel" id="soopPanel" hidden>
        <div class="panel-head"><h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-mega"/></svg>방송국 최신 글 <span class="sec-sub">SOOP에서 자동으로 가져와요</span></h2></div>
        <div class="panel-body mini-list" id="soopList"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg>게시판 최근 글</h2><a class="text-btn" href="board.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
        <div class="panel-body mini-list" id="boardList"></div>
      </div>
    </div>
  </section>

  <section class="band white" id="videoBand">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="sec-title">영상 모아보기 <span id="videoChips"></span></h2>
        <a class="text-btn" href="archive.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </div>
      <div class="cards" id="videos"></div>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="sec-head">
        <h2 class="sec-title">구독 퍼스나콘 <span class="sec-sub">씨앗부터 황금 체리까지</span></h2>
      </div>
      <div class="persona" id="persona"></div>
    </div>
  </section>

  <section class="band white" id="schedule">
    <div class="wrap two">
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg>이번 주 일정</h2><span id="schedChip"></span></div>
        <div class="panel-body sched" id="sched"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-flag"/></svg>공약현황</h2><span style="display:flex;gap:8px;align-items:center"><span id="promiseChip"></span><a class="text-btn" href="promise.html">전체보기 <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a></span></div>
        <div class="panel-body promise" id="promiseList"></div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap bare">
      <div class="panel">
        <div class="panel-head"><h2 class="sec-title"><svg class="ico" aria-hidden="true"><use href="#i-game"/></svg>놀이터</h2><span class="chip">누구나</span></div>
        <div class="panel-body rows" id="gameList"></div>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data/site.js"></script>
<script src="data/content.js"></script>
<script src="js/site.js"></script>
<script src="js/games.js"></script>
<script src="js/board-store.js"></script>
<script src="js/home.js"></script>
</body>
</html>
